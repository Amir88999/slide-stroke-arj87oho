<!doctype html>
<html>
<head>
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    renderer="logarithmicDepthBuffer: true; shadowMap: { enabled: true }"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    embedded
    gesture-detector
  >
    <a-assets>
      <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
    </a-assets>

    <!-- Lighting with Shadows -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity 
      light="type: directional; color: #ffffff; intensity: 0.8; castShadow: true"
      position="0 3 2"
      rotation="-45 0 0"
    ></a-entity>

    <!-- Shadow receiving plane (invisible but catches shadow) -->
    <a-entity 
      geometry="primitive: plane; width: 1; height: 1;"
      rotation="-90 0 0"
      material="color: #000; opacity: 0"
      shadow="receive: true"
    ></a-entity>

    <a-marker
      id="animated-marker"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <a-entity
        id="model"
        gltf-model="#animated-asset"
        class="clickable"
        scale="0.015688 0.015688 0.015688"
        animation-mixer="loop: repeat"
        gesture-handler
        shadow="cast: true"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Pause Button -->
  <button id="toggleAnimBtn" style="
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: rgba(255,255,255,0.8);
    color: black;
    font-weight: bold;
  ">
    Pause Animation
  </button>

  <script>
    const toggleBtn = document.getElementById("toggleAnimBtn");
    const model = document.querySelector("#model");

    let isPaused = false;
    toggleBtn.addEventListener("click", () => {
      if (!model) return;
      if (isPaused) {
        model.setAttribute("animation-mixer", "timeScale: 1");
        toggleBtn.textContent = "Pause Animation";
      } else {
        model.setAttribute("animation-mixer", "timeScale: 0");
        toggleBtn.textContent = "Play Animation";
      }
      isPaused = !isPaused;
    });
  </script>
</body>
</html>
